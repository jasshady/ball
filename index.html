<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Particle Morph</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 3D Container -->
    <div id="container"></div>

    <!-- UI: Header -->
    <div class="header">
        <h1>Particle<br>Morph</h1>
    </div>

    <!-- UI: Color Controls -->
    <div class="color-controls">
        <div class="color-scheme">
            <button class="active" id="btn-cosmic" onclick="changeTheme('cosmic')">
                <div class="color-preview cosmic"></div>
                <span>Cosmic</span>
            </button>
            <button id="btn-neon" onclick="changeTheme('neon')">
                <div class="color-preview neon"></div>
                <span>Neon</span>
            </button>
            <button id="btn-sunset" onclick="changeTheme('sunset')">
                <div class="color-preview sunset"></div>
                <span>Sunset</span>
            </button>
            <button id="btn-ocean" onclick="changeTheme('ocean')">
                <div class="color-preview ocean"></div>
                <span>Ocean</span>
            </button>
        </div>
    </div>

    <!-- UI: Input -->
    <div class="input-container">
        <div class="input-wrapper">
            <!-- CHANGED: Increased maxlength and updated default value -->
            <input type="text" id="morphText" placeholder="Type your reality..." maxlength="50" value="Good Morning Baby">
            <button id="typeBtn">
                <span class="button-content">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12H19M19 12L12 5M19 12L12 19"/>
                    </svg>
                    <span>Create</span>
                </span>
            </button>
        </div>
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>
    
    <!-- Main Script -->
    <script src="script.js"></script>
</body>
</html>
